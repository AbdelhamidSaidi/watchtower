# ClickHouse as a single-replica StatefulSet.
#
# Deliberately not the Altinity operator: at one replica it adds a
# controller and CRDs for nothing. Sharding is the step where an operator
# earns its place -- see docs/context.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
data:
  # Prometheus endpoint, and a hard memory ceiling so ClickHouse throttles
  # queries instead of being OOM-killed by the container limit.
  watchtower.xml: |
    <clickhouse>
      <prometheus>
        <endpoint>/metrics</endpoint>
        <port>9363</port>
        <metrics>true</metrics>
        <events>true</events>
        <asynchronous_metrics>true</asynchronous_metrics>
      </prometheus>
      <max_server_memory_usage_to_ram_ratio>0.7</max_server_memory_usage_to_ram_ratio>
      <mark_cache_size>67108864</mark_cache_size>
      <!-- Internal diagnostic logs duplicated by the Prometheus endpoint above.
           metric_log alone (one column per metric) needs more memory to merge
           than a small node has; it failed and retried forever in dev. -->
      <metric_log remove="1"/>
      <asynchronous_metric_log remove="1"/>
      <trace_log remove="1"/>
      <text_log remove="1"/>
      <query_views_log remove="1"/>
      <processors_profile_log remove="1"/>
    </clickhouse>
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9363"
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:25.8.33
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
            - name: metrics
              containerPort: 9363
          env:
            - name: CLICKHOUSE_DB
              value: watchtower
            - name: CLICKHOUSE_USER
              value: watchtower
            # The server's own password. The pipeline, as a client, reads the
            # same value from a mounted file (config.read_secret).
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: watchtower-secrets
                  key: clickhouse_password
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
            # the {kafka_brokers} macro in 03_streaming_ingest.sql
            - name: WATCHTOWER_KAFKA_BROKERS
              value: watchtower-kafka-bootstrap:9092
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: config
              mountPath: /etc/clickhouse-server/config.d/watchtower.xml
              subPath: watchtower.xml
              readOnly: true
            - name: streaming
              mountPath: /etc/clickhouse-server/config.d/streaming.xml
              subPath: streaming.xml
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          # Measured in dev at 1,000 events/s with 50 ms ingest blocks:
          # 1.3-1.55 GB resident (merges of a 63-column table hold buffers
          # per column). The old 1 GiB limit would have OOM-killed it.
          resources:
            requests:
              memory: 1Gi
              cpu: 250m
            limits:
              memory: 2Gi
      volumes:
        - name: init
          configMap:
            name: clickhouse-init
        - name: config
          configMap:
            name: clickhouse-config
        - name: streaming
          configMap:
            name: clickhouse-streaming
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
spec:
  selector:
    app: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: http
    - name: native
      port: 9000
      targetPort: native
