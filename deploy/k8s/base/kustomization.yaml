# Base: everything the pipeline needs, sized for the smallest environment.
#
# Memory REQUESTS are set from measured usage (docker stats, dev stack at
# 100 events/sec), not guesses: guessed values over-reserved Kafka 3x and
# under-reserved the pipeline 2x.
# Overlays (staging, prod) set the namespace and scale.
#
# Some ConfigMaps are generated from files OUTSIDE this directory (the
# ClickHouse schema, the observability config) so each lives in exactly one
# place. That needs kustomize's load restrictor relaxed, which is why the
# Makefile renders with:
#     kubectl kustomize --load-restrictor LoadRestrictionsNone <overlay>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - kafka.yaml
  - schema-registry.yaml
  - clickhouse.yaml
  - stream.yaml
  - producer.yaml
  - observability.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: watchtower
    includeSelectors: false

configMapGenerator:
  # Pipeline and producer settings. Overlays merge over these.
  - name: pipeline-env
    literals:
      - KAFKA_BOOTSTRAP_SERVERS=watchtower-kafka-bootstrap:9092
      - KAFKA_TOPIC=security-logs
      - KAFKA_STARTING_OFFSETS=latest
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - CLICKHOUSE_HOST=clickhouse
      - LOGS_PER_SECOND=100

  - name: clickhouse-init
    files:
      - 01_schema.sql=../../../clickhouse/init/01_schema.sql
      - 01b_ml_columns.sql=../../../clickhouse/init/01b_ml_columns.sql
      - 02_v2_request_context.sql=../../../clickhouse/init/02_v2_request_context.sql
      - 03_streaming_ingest.sql=../../../clickhouse/init/03_streaming_ingest.sql
      - 04_orchestration.sql=../../../clickhouse/init/04_orchestration.sql
      - 05_ml.sql=../../../clickhouse/init/05_ml.sql

  - name: clickhouse-streaming
    files:
      - streaming.xml=../../../clickhouse/config/streaming.xml

  - name: prometheus-config
    files:
      - prometheus.yml=../../observability/prometheus.yml
      - alerts.yml=../../observability/alerts.yml

  - name: grafana-datasources
    files:
      - datasource.yml=../../observability/grafana-datasource.yml

  - name: grafana-dashboard-providers
    files:
      - dashboards.yml=../../observability/grafana-dashboards.yml

  - name: grafana-dashboards
    files:
      - watchtower.json=../../observability/grafana-dashboard.json
