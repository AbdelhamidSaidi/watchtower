# The Spark pipeline (micro-batches), as an opt-in component.
#
# The live path is the Flink job in base/stream.yaml. Spark remains for
# what micro-batches are good at -- replaying a topic range, backfilling
# after a rule change -- and runs the same etl/core logic
# (tests/unit/test_parity.py). To deploy it alongside, add to an overlay:
#
#     components:
#       - ../../components/spark-pipeline
#
# Give it its own KAFKA_TOPIC/checkpoints if it must not double-write
# what Flink already stored (security_events deduplicates on merge anyway).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - pipeline.yaml
