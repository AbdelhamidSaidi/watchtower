# The streaming pipeline: a Spark driver in client mode, run by a Deployment.
#
# Why a Deployment and not a Job or the Spark operator: the pipeline never
# finishes. If the driver dies, the Deployment restarts it and it resumes
# from its checkpoint -- that pairing (restart + durable checkpoint) IS the
# recovery story.
#
# SPARK_EXECUTORS picks where the work runs:
#   0     local[N] inside this pod -- for machines too small for executors
#   N     N executor pods, fixed
#   auto  executor pods between SPARK_MIN_EXECUTORS and SPARK_MAX_EXECUTORS,
#         added when batches fall behind the live stream and removed when
#         they idle (etl/scaling/executors.py). The driver creates and
#         deletes the pods itself and owns them: they are garbage-collected
#         when the driver pod goes away.
#
# The DRIVER is never scaled: one query, one checkpoint, one driver.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
---
# What the driver needs to manage its own executors, and nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-driver
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, watch, delete, deletecollection, patch]
  - apiGroups: [""]
    resources: [configmaps, services]
    verbs: [create, get, list, delete, deletecollection]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-driver
subjects:
  - kind: ServiceAccount
    name: spark
roleRef:
  kind: Role
  name: spark-driver
  apiGroup: rbac.authorization.k8s.io
---
# Kafka offsets and state-store contents. Survives pod restarts, so a
# restarted driver resumes where it stopped with warm dedup and feature
# state.
#
# LIMIT: ReadWriteOnce. Executors write state-store files here too, which
# works while every Spark pod lands on the same node (true for this local
# single-node cluster). Across nodes it needs object storage -- s3a:// -- see
# docs/context.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pipeline-checkpoints
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline
spec:
  replicas: 1                  # never more: two drivers on one checkpoint corrupt it
  strategy:
    type: Recreate             # ...which is also why this is not RollingUpdate
  selector:
    matchLabels:
      app: pipeline
  template:
    metadata:
      labels:
        app: pipeline
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9108"
    spec:
      serviceAccountName: spark
      terminationGracePeriodSeconds: 60
      containers:
        - name: driver
          image: watchtower/spark:3.5.9
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              if [ "${SPARK_EXECUTORS}" = "0" ]; then
                echo "local mode: local[${SPARK_LOCAL_CORES}]"
                MASTER=(--master "local[${SPARK_LOCAL_CORES}]")
              else
                if [ "${SPARK_EXECUTORS}" = "auto" ]; then
                  echo "kubernetes mode: ${SPARK_MIN_EXECUTORS}..${SPARK_MAX_EXECUTORS} executors, autoscaled"
                  INSTANCES="${SPARK_MIN_EXECUTORS}"
                else
                  echo "kubernetes mode: ${SPARK_EXECUTORS} executor(s)"
                  INSTANCES="${SPARK_EXECUTORS}"
                fi
                MASTER=(
                  --master k8s://https://kubernetes.default.svc
                  --deploy-mode client
                  --conf spark.executor.instances="${INSTANCES}"
                  # the autoscaler drives the count; Spark's own allocation
                  # manager must stay off (see etl/scaling/executors.py)
                  --conf spark.dynamicAllocation.enabled=false
                  --conf spark.executor.memory="${SPARK_EXECUTOR_MEMORY}"
                  --conf spark.executor.memoryOverhead="${SPARK_EXECUTOR_MEMORY_OVERHEAD}"
                  --conf spark.executor.cores="${SPARK_EXECUTOR_CORES}"
                  # schedule on memory, not on whole CPUs: a 1-core executor
                  # requesting a full CPU would strand a small node's cores
                  --conf spark.kubernetes.executor.request.cores="${SPARK_EXECUTOR_REQUEST_CORES}"
                  --conf spark.kubernetes.namespace="${POD_NAMESPACE}"
                  --conf spark.kubernetes.container.image="${SPARK_IMAGE}"
                  --conf spark.kubernetes.container.image.pullPolicy=IfNotPresent
                  --conf spark.kubernetes.authenticate.driver.serviceAccountName=spark
                  --conf spark.kubernetes.driver.pod.name="${POD_NAME}"
                  --conf spark.kubernetes.executor.podNamePrefix=pipeline-exec
                  --conf spark.kubernetes.executor.label.app=pipeline-executor
                  --conf spark.kubernetes.executor.volumes.persistentVolumeClaim.ckpt.options.claimName=pipeline-checkpoints
                  --conf spark.kubernetes.executor.volumes.persistentVolumeClaim.ckpt.mount.path=/var/lib/watchtower/checkpoints
                  --conf spark.driver.host="${POD_IP}"
                  --conf spark.driver.port=7078
                  --conf spark.driver.blockManager.port=7079
                )
              fi
              exec /opt/spark/bin/spark-submit "${MASTER[@]}" \
                --driver-memory "${SPARK_DRIVER_MEMORY}" \
                /opt/watchtower/etl/pipeline.py
          envFrom:
            - configMapRef:
                name: pipeline-env
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Secrets arrive as files, never as values in the pod spec.
            - name: CLICKHOUSE_PASSWORD_FILE
              value: /var/run/secrets/watchtower/clickhouse_password
            - name: GROQ_API_KEY_FILE
              value: /var/run/secrets/watchtower/groq_api_key
          ports:
            - name: metrics
              containerPort: 9108
            - name: driver
              containerPort: 7078
            - name: blockmanager
              containerPort: 7079
            - name: ui
              containerPort: 4040
          volumeMounts:
            - name: checkpoints
              mountPath: /var/lib/watchtower/checkpoints
            - name: secrets
              mountPath: /var/run/secrets/watchtower
              readOnly: true
          # No liveness probe on purpose. The driver exits non-zero when a
          # query dies (awaitAnyTermination), and the restart that follows
          # is the recovery. A hung-but-alive stream is caught by the
          # StreamStalled alert instead of being killed blindly.
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 20
            periodSeconds: 15
          # Measured 1.7 GiB in dev at a 1g heap: the JVM, plus Python
          # workers for applyInPandasWithState, plus RocksDB off-heap. The
          # heap is only part of it -- size the limit for the whole process.
          resources:
            requests:
              memory: 1Gi
              cpu: 250m
            limits:
              memory: 1792Mi
      volumes:
        - name: checkpoints
          persistentVolumeClaim:
            claimName: pipeline-checkpoints
        - name: secrets
          secret:
            secretName: watchtower-secrets
            items:
              - key: clickhouse_password
                path: clickhouse_password
              - key: groq_api_key
                path: groq_api_key
---
apiVersion: v1
kind: Service
metadata:
  name: pipeline
spec:
  selector:
    app: pipeline
  ports:
    - name: metrics
      port: 9108
      targetPort: metrics
    - name: ui
      port: 4040
      targetPort: ui
