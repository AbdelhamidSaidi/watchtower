# Alert rules. Each one names the failure it catches and why it matters.
#
# There is no Alertmanager in the local deployment (memory), so these fire
# in the Prometheus UI (/alerts) and on the Grafana dashboard. Wiring them to
# Slack or email is one Alertmanager Deployment away.
groups:
  # The live path: the Flink job (etl/stream/job.py).
  - name: watchtower-stream
    rules:
      - alert: StreamJobDown
        expr: >-
          up{job="watchtower-stream", component="jobmanager"} == 0
          or absent(up{job="watchtower-stream", component="jobmanager"})
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: The Flink JobManager is not reachable
          description: No events are being scored or stored.

      - alert: StreamFallingBehind
        expr: sum(flink_taskmanager_job_task_operator_KafkaSourceReader_KafkaConsumer_records_lag_max) > 10000
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} events waiting in Kafka"
          description: >-
            The job reads slower than events arrive. The autoscaler should
            be adding TaskManagers; if this persists it has hit its ceiling
            (job.autoscaler.vertex.max-parallelism) or the cluster is full.

      # Data quality between the transformation steps (etl/core/dq.py):
      # events that got through validation but are doubtful -- defaulted
      # severity, no user on a login, an address GeoIP cannot place, a
      # clock far off. A little is normal; a source sending them in bulk
      # quietly weakens detection.
      - alert: StreamDataQualityDegraded
        expr: >-
          sum(increase({__name__=~"flink_taskmanager_job_task_operator_watchtower_dq_(normalize|enrich)_.+"}[10m]))
          / clamp_min(sum(increase(flink_taskmanager_job_task_operator_watchtower_scored_events[10m])), 1)
          > 0.01
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value | humanizePercentage }} of events doubtful after normalize/enrich"
          description: >-
            Which issue: the dq_normalize_* / dq_enrich_* series on the
            Grafana dashboard. Usually one log source changed its format.

      # Features and rules contradicting themselves (a 1-minute count above
      # its 5-minute one, an action that does not match the score) is a bug
      # or corrupted state, never traffic. One is enough.
      - alert: StreamLogicInconsistent
        expr: >-
          sum(increase({__name__=~"flink_taskmanager_job_task_operator_watchtower_dq_(features|rules)_.+"}[10m])) > 0
        labels: {severity: critical}
        annotations:
          summary: "{{ $value }} events with inconsistent features or decisions"
          description: >-
            A detection bug or corrupted keyed state. Compare the job's
            version with the last green test run; restore from a savepoint
            if the state is suspect (operations.md, Recovery).

      - alert: StreamRejectingEvents
        expr: sum(increase(flink_taskmanager_job_task_operator_watchtower_rejected_events[10m])) > 0
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} messages rejected in the last 10 minutes"
          description: >-
            A broken log source, a producer on an unregistered schema, or
            something deliberately malforming logs. Check
            rejected_events.reject_reason. (Rows ClickHouse itself could not
            parse -- sink_parse_error -- are not counted here; query for them.)

      - alert: StreamLatencyHigh
        expr: max(flink_taskmanager_job_task_operator_watchtower_kafka_to_scored_p95_ms) > 2000
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "p95 Kafka -> decision latency is {{ $value }} ms"
          description: >-
            Events are decided more than 2 s after they reach Kafka. Look at
            busy/backpressured time per operator in the Flink UI.

  # The micro-batch path: Spark, when components/spark-pipeline is deployed.
  - name: watchtower-pipeline
    rules:
      - alert: PipelineDown
        expr: up{job="watchtower-pipeline"} == 0 or absent(up{job="watchtower-pipeline"})
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: Pipeline driver is not reachable
          description: No events are being processed or stored.

      - alert: StreamingQueryStopped
        expr: watchtower_query_up == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Streaming query {{ $labels.query }} has terminated"

      - alert: StreamStalled
        expr: time() - watchtower_last_progress_timestamp_seconds > 120
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "No progress from {{ $labels.query }} for over 2 minutes"
          description: >-
            The driver is up but the stream is not advancing. A process can
            be alive and useful to no one -- this is the alert for that.

      - alert: BatchFallingBehind
        expr: watchtower_batch_duration_seconds{query="events"} > scalar(watchtower_trigger_interval_seconds)
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Micro-batches take longer than the trigger interval
          description: >-
            Batches last {{ $value | humanizeDuration }}. The pipeline cannot
            keep up with arrival rate; lag will grow until it is scaled or the
            trigger is lengthened.

      - alert: KafkaLagGrowing
        expr: >-
          watchtower_kafka_offsets_behind_latest{query="events"} > 5000
          and deriv(watchtower_kafka_offsets_behind_latest{query="events"}[10m]) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Kafka lag is {{ $value }} messages and rising"
          description: Detection is falling behind real time.

      - alert: RejectedEventsPresent
        expr: increase(watchtower_rows_written_total{table="rejected_events"}[10m]) > 0
        labels: {severity: warning}
        annotations:
          summary: Events are being rejected
          description: >-
            A broken log source, a producer on an unregistered schema, or
            something deliberately malforming logs. Check rejected_events.reject_reason.

      - alert: DetectionOutage
        expr: increase(watchtower_detection_outcomes_total{outcome="error"}[10m]) > 0
        labels: {severity: critical}
        annotations:
          summary: Events are passing detection unjudged
          description: >-
            Detection fails open. Without this alert an API outage looks
            exactly like a quiet night.

      - alert: DetectionDisabled
        expr: increase(watchtower_detection_outcomes_total{outcome="disabled"}[10m]) > 0
        labels: {severity: info}
        annotations:
          summary: Detection is disabled (no GROQ_API_KEY)

      - alert: StateStoreGrowing
        expr: watchtower_state_rows{query="events"} > 5e6
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "State store holds {{ $value }} rows"
          description: Dedup and feature state is large; check the watermark.

      - alert: ExecutorsPending
        expr: watchtower_executors_target - watchtower_executors_active > 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Autoscaler wants {{ $value }} more executor(s) than are running"
          description: >-
            The executor pods cannot be scheduled -- the cluster is out of
            memory or CPU. The pipeline is running below the capacity the load
            needs; add nodes or raise the node's memory.

      - alert: ExecutorsAtMaximum
        expr: >-
          watchtower_executors_target >= watchtower_executors_max
          and on() watchtower_batch_duration_seconds{query="events"}
          > on() watchtower_trigger_interval_seconds
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: Batches still exceed the trigger with the executors the autoscaler can get
          description: Raise SPARK_MAX_EXECUTORS or the cluster's capacity.

  - name: watchtower-kafka
    rules:
      - alert: KafkaUnderReplicatedPartitions
        expr: sum(kafka_server_replicamanager_underreplicatedpartitions) > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $value }} under-replicated partitions"
          description: A broker is down or cannot keep up; data is at risk.

      - alert: KafkaBrokerDown
        expr: up{job="kafka", pool="brokers"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Kafka broker {{ $labels.pod }} is down"
