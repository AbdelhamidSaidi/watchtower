# Alert rules. Each one names the failure it catches and why it matters.
#
# There is no Alertmanager in the local deployment (memory), so these fire
# in the Prometheus UI (/alerts) and on the Grafana dashboard. Wiring them to
# Slack or email is one Alertmanager Deployment away.
groups:
  # The live path: the Flink job (etl/stream/job.py).
  - name: watchtower-stream
    rules:
      - alert: StreamJobDown
        expr: >-
          up{job="watchtower-stream", component="jobmanager"} == 0
          or absent(up{job="watchtower-stream", component="jobmanager"})
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: The Flink JobManager is not reachable
          description: No events are being scored or stored.

      - alert: StreamFallingBehind
        expr: sum(flink_taskmanager_job_task_operator_KafkaSourceReader_KafkaConsumer_records_lag_max) > 10000
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} events waiting in Kafka"
          description: >-
            The job reads slower than events arrive. The autoscaler should
            be adding TaskManagers; if this persists it has hit its ceiling
            (job.autoscaler.vertex.max-parallelism) or the cluster is full.

      # Data quality between the transformation steps (etl/core/dq.py):
      # events that got through validation but are doubtful -- defaulted
      # severity, no project on a build, a runner the inventory cannot place, a
      # clock far off. A little is normal; a runner sending them in bulk
      # quietly weakens detection.
      - alert: StreamDataQualityDegraded
        expr: >-
          sum(increase({__name__=~"flink_taskmanager_job_task_operator_watchtower_dq_(normalize|enrich)_.+"}[10m]))
          / clamp_min(sum(increase(flink_taskmanager_job_task_operator_watchtower_scored_events[10m])), 1)
          > 0.01
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value | humanizePercentage }} of events doubtful after normalize/enrich"
          description: >-
            Which issue: the dq_normalize_* / dq_enrich_* series on the
            Grafana dashboard. Usually one build tool changed its log format.

      # Features and rules contradicting themselves (a 1-minute count above
      # its 5-minute one, an action that does not match the score) is a bug
      # or corrupted state, never traffic. One is enough.
      - alert: StreamLogicInconsistent
        expr: >-
          sum(increase({__name__=~"flink_taskmanager_job_task_operator_watchtower_dq_(features|rules)_.+"}[10m])) > 0
        labels: {severity: critical}
        annotations:
          summary: "{{ $value }} events with inconsistent features or decisions"
          description: >-
            A detection bug or corrupted keyed state. Compare the job's
            version with the last green test run; restore from a savepoint
            if the state is suspect (operations.md, Recovery).

      - alert: StreamRejectingEvents
        expr: sum(increase(flink_taskmanager_job_task_operator_watchtower_rejected_events[10m])) > 0
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} messages rejected in the last 10 minutes"
          description: >-
            A broken log source, a producer on an unregistered schema, or
            something deliberately malforming logs. Check
            rejected_events.reject_reason. (Rows ClickHouse itself could not
            parse -- sink_parse_error -- are not counted here; query for them.)

      - alert: StreamLatencyHigh
        expr: max(flink_taskmanager_job_task_operator_watchtower_kafka_to_scored_p95_ms) > 2000
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "p95 Kafka -> decision latency is {{ $value }} ms"
          description: >-
            Events are decided more than 2 s after they reach Kafka. Look at
            busy/backpressured time per operator in the Flink UI.

  - name: watchtower-kafka
    rules:
      - alert: KafkaUnderReplicatedPartitions
        expr: sum(kafka_server_replicamanager_underreplicatedpartitions) > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $value }} under-replicated partitions"
          description: A broker is down or cannot keep up; data is at risk.

      - alert: KafkaBrokerDown
        expr: up{job="kafka", pool="brokers"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "Kafka broker {{ $labels.pod }} is down"
