# Watchtower DEV stack -- the fast inner loop on one machine.
#
#   producer -> kafka -> Flink (per event) -> kafka -> clickhouse
#                  \-> schema-registry (karapace)          ^ airflow watches it all
#
# Kubernetes (deploy/k8s) is the scalable deployment. This file exists so a
# code change can be tried in seconds: ./etl and ./schemas are mounted over
# the image, so edits need a job restart, not a rebuild.
#
# Versions match the Kubernetes deployment exactly (Kafka 4.3.1, the same
# Flink image), so "works in dev" means something in staging.
#
#   make secrets     once, before first start
#   make dev-up      start everything
#   make produce     synthetic traffic from the host
#   docker compose --profile sim up -d   ...or the producer as a container
#   make monitor-up  Prometheus + Grafana + the auditor (profile: monitoring)

# Pinned, not taken from the folder name: the volumes (watchtower_kafka-data,
# watchtower_clickhouse-data, ...) were created under this name, and the
# project folder was renamed to sekera-pipeline. Without it, compose would
# start a second, empty stack.
name: watchtower

services:
  kafka:
    image: apache/kafka:4.3.1
    # Back on its own after a crash or a memory kill: the pipeline's data
    # path must not wait for someone to notice.
    restart: unless-stopped
    container_name: watchtower-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by kafka-init, never by a stray client.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      # Without this the broker writes to /tmp/kafka-logs inside the
      # container and the volume below holds nothing.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx320m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    # A port check, not kafka-broker-api-versions.sh: that starts a whole
    # JVM (~200 MB, a CPU burst) every 10 s, forever -- on a ~4 GB VM that
    # was part of what pushed it into swap.
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # One-shot: the topics, with the same 6 partitions staging uses.
  #   security-logs           raw events in (producer -> Flink)
  #   security-events-scored  finished rows out (Flink -> ClickHouse)
  #   security-logs-rejected  dead letters out (Flink -> ClickHouse)
  kafka-init:
    image: apache/kafka:4.3.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for topic in security-logs security-events-scored security-logs-rejected; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists \
            --topic "$$topic" --partitions 6 --replication-factor 1 --config retention.ms=86400000
        done
        # Record timestamps = broker append time, not the source's clock:
        # the job's Kafka -> decision latency metric starts there.
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:29092 --alter --entity-type topics \
          --entity-name security-logs --add-config message.timestamp.type=LogAppendTime
    restart: "no"

  # Karapace (Aiven, Apache-2.0): Confluent-API-compatible, same `_schemas`
  # topic, same endpoints. Chosen over cp-schema-registry for footprint --
  # 563 MB vs 2,180 MB compressed -- with no change to any client code.
  schema-registry:
    image: ghcr.io/aiven-open/karapace:6.2.3
    # Back on its own after a crash or a memory kill: the pipeline's data
    # path must not wait for someone to notice.
    restart: unless-stopped
    container_name: watchtower-schema-registry
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    entrypoint: ["python3", "-m", "karapace"]
    ports:
      - "8081:8081"
    environment:
      KARAPACE_KARAPACE_REGISTRY: "true"
      KARAPACE_HOST: 0.0.0.0
      KARAPACE_PORT: 8081
      KARAPACE_ADVERTISED_HOSTNAME: schema-registry
      KARAPACE_ADVERTISED_PROTOCOL: http
      KARAPACE_BOOTSTRAP_URI: kafka:29092
      KARAPACE_CLIENT_ID: karapace-0
      KARAPACE_GROUP_ID: karapace
      KARAPACE_MASTER_ELIGIBILITY: "true"
      KARAPACE_MASTER_ELECTION_STRATEGY: highest
      KARAPACE_TOPIC_NAME: _schemas
      KARAPACE_REPLICATION_FACTOR: 1
      KARAPACE_COMPATIBILITY: BACKWARD
      KARAPACE_LOG_LEVEL: WARNING
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/subjects', timeout=4)"]
      interval: 10s
      timeout: 6s
      retries: 18
      start_period: 20s

  # One-shot: the only path by which a schema reaches the registry.
  schema-init:
    # The producer image: Python + fastavro, and the same schemas/ code.
    image: watchtower/producer:1.0
    depends_on:
      schema-registry:
        condition: service_healthy
    command: ["python3", "/opt/watchtower/tools/schema_registry.py", "register", "--url", "http://schema-registry:8081"]
    volumes:
      - ./schemas:/opt/watchtower/schemas:ro
      - ./tools:/opt/watchtower/tools:ro
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:25.8.33
    # Back on its own after a crash or a memory kill: the pipeline's data
    # path must not wait for someone to notice.
    restart: unless-stopped
    container_name: watchtower-clickhouse
    ports:
      - "8123:8123"   # HTTP  (clickhouse-connect, curl, UI)
      - "9000:9000"   # native (clickhouse-client)
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_DB: watchtower
      CLICKHOUSE_USER: watchtower
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      # the {kafka_brokers} macro in 03_streaming_ingest.sql
      WATCHTOWER_KAFKA_BROKERS: kafka:29092
    # The image reads its password from an env var only, so it is exported
    # from the mounted secret inside the container -- never written into
    # this file or visible in `docker inspect`.
    entrypoint: ["/bin/sh", "-c", "export CLICKHOUSE_PASSWORD=\"$$(cat /run/secrets/clickhouse_password)\" && exec /entrypoint.sh"]
    secrets:
      - clickhouse_password
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/config/streaming.xml:/etc/clickhouse-server/config.d/streaming.xml:ro
      - ./clickhouse/config/dev-limits.xml:/etc/clickhouse-server/config.d/dev-limits.xml:ro
      - ./clickhouse/config/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml:ro
    ulimits:
      # ClickHouse refuses to start with the default Docker fd limit.
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user watchtower --password \"$$(cat /run/secrets/clickhouse_password)\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # --- the live path: Flink, one event at a time ----------------------------
  # Application mode: the JobManager runs the job and nothing else. It
  # resumes from the newest checkpoint on restart (docker/flink/run-job.sh).
  flink-jobmanager:
    build:
      context: .
      dockerfile: docker/flink/Dockerfile
      target: runtime
    image: watchtower/flink:2.2.1
    container_name: watchtower-flink-jobmanager
    depends_on:
      schema-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    command: ["/opt/watchtower/run-job.sh"]
    # FLINK_PROPERTIES is appended verbatim to Flink's config -- comments
    # inside it become (bogus) keys, so they live here:
    #   parallelism: FLINK_PARALLELISM=N with N TaskManagers, e.g.
    #     FLINK_PARALLELISM=2 docker compose up -d --scale flink-taskmanager=2
    #   numberOfTaskSlots 1: in thread mode all slots of a TaskManager share
    #     one Python interpreter and its GIL. Measured at 1,000 events/sec
    #     in: 1 slot ~1,300-2,000/sec, 2 slots ~1,150, 4 slots ~450. Scale
    #     out with TaskManagers (Kubernetes: 1 slot per pod).
    #   managed.fraction 0.05: heap state + thread mode use no managed
    #     memory; Flink's default 40% would sit idle.
    environment: &flink-env
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      WATCHTOWER_PYTHON_EXECUTION_MODE: ${WATCHTOWER_PYTHON_EXECUTION_MODE:-thread}
      WATCHTOWER_PYTHON_BUNDLE_MS: ${WATCHTOWER_PYTHON_BUNDLE_MS:-5}
      WATCHTOWER_CHECKPOINT_INTERVAL_MS: ${WATCHTOWER_CHECKPOINT_INTERVAL_MS:-10000}
      # The active ML model is read from ClickHouse (etl/stream/models.py);
      # WATCHTOWER_ML=off scores with rules alone.
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
      WATCHTOWER_ML: ${WATCHTOWER_ML:-on}
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 640m
        taskmanager.memory.process.size: 1280m
        taskmanager.numberOfTaskSlots: 1
        parallelism.default: ${FLINK_PARALLELISM:-1}
        taskmanager.memory.managed.fraction: 0.05
        state.backend.type: hashmap
        execution.checkpointing.dir: file:///var/lib/watchtower/flink-checkpoints
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        execution.checkpointing.num-retained: 2
        restart-strategy.type: exponential-delay
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
        rest.flamegraph.enabled: true
    ports:
      - "8082:8081"   # Flink UI
      - "9249:9249"   # /metrics (JobManager)
    secrets:
      - clickhouse_password
    volumes:
      - ./etl:/opt/watchtower/etl:ro
      - ./schemas:/opt/watchtower/schemas:ro
      - flink-checkpoints:/var/lib/watchtower/flink-checkpoints
    restart: unless-stopped

  flink-taskmanager:
    image: watchtower/flink:2.2.1
    # no container_name: TaskManagers scale (--scale flink-taskmanager=N)
    depends_on:
      - flink-jobmanager
    command: ["taskmanager"]
    environment: *flink-env
    secrets:
      - clickhouse_password
    ports:
      - "9250-9257:9249"   # /metrics, one host port per TaskManager (9250 = the first)
    volumes:
      - ./etl:/opt/watchtower/etl:ro
      - ./schemas:/opt/watchtower/schemas:ro
      - flink-checkpoints:/var/lib/watchtower/flink-checkpoints
    restart: unless-stopped

  producer:
    profiles: [sim]
    build:
      context: .
      dockerfile: docker/producer/Dockerfile
    image: watchtower/producer:1.0
    depends_on:
      schema-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKER: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      LOGS_PER_SECOND: ${LOGS_PER_SECOND:-1000}
    restart: unless-stopped

  # --- orchestration (profile: airflow) -------------------------------------
  # Airflow runs the batch side around the stream (orchestration/dags):
  # hourly data-quality checks, the daily rollup, detection-quality
  # evaluation. Opt-in: with its database it takes ~0.3 GB idle and ~0.5 GB
  # while a task runs (measured) -- room a ~4 GB Docker VM has with the
  # producer at 100 events/s, not at 1,000 (that stack alone fills swap):
  #   LOGS_PER_SECOND=100 docker compose --profile sim --profile airflow up -d
  # UI: http://localhost:8080  (admin / secrets/airflow_admin_password)
  airflow-db:
    profiles: [airflow]
    image: postgres:18.6-alpine
    container_name: watchtower-airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_DB: airflow
      POSTGRES_PASSWORD_FILE: /run/secrets/airflow_db_password
    secrets:
      - airflow_db_password
    volumes:
      - airflow-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # API server, scheduler and DAG processor in one container (start.sh);
  # Kubernetes runs them as separate pods (components/airflow).
  airflow:
    profiles: [airflow]
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
      target: runtime
    image: watchtower/airflow:3.3.2
    container_name: watchtower-airflow
    depends_on:
      airflow-db:
        condition: service_healthy
    ports:
      - "8080:8080"   # UI + API
    environment:
      # Airflow runs these commands to read the values, so the password and
      # the signing key stay in mounted files.
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD: >-
        sh -c 'printf "postgresql+psycopg2://airflow:%s@airflow-db/airflow" "$$(cat /run/secrets/airflow_db_password)"'
      AIRFLOW__API_AUTH__JWT_SECRET_CMD: cat /run/secrets/airflow_jwt_secret
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://localhost:8080/execution/
      AIRFLOW__CORE__PARALLELISM: 2
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
      FLINK_REST_URL: http://flink-jobmanager:8081
      GROQ_API_KEY_FILE: /run/secrets/groq_api_key
      WATCHTOWER_SYNTHETIC_TRAFFIC: "true"
    secrets:
      - clickhouse_password
      - airflow_db_password
      - airflow_jwt_secret
      - airflow_admin_password
      - groq_api_key
    volumes:
      # Edit a DAG or its ops and the change is live within a minute, no
      # rebuild. The image carries the same files for Kubernetes.
      - ./orchestration:/opt/watchtower/orchestration:ro
      - ./tools/evaluate_detection.py:/opt/watchtower/tools/evaluate_detection.py:ro
      - ./etl/core:/opt/watchtower/etl/core:ro
      - airflow-logs:/opt/airflow/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    restart: unless-stopped

  # --- monitoring (profile: monitoring) ---------------------------------------
  # Prometheus and Grafana as in Kubernetes (deploy/observability), plus the
  # auditor (monitor/): what the pipeline stored, decided, and should have
  # decided, as metrics. Opt-in, like Airflow: ~0.35 GB together.
  #   make monitor-up      Grafana on http://localhost:3000 (live audit dashboard)
  monitor:
    profiles: [monitoring]
    # Python 3.12 with kafka-python and fastavro: all the monitor needs, and
    # the code is mounted, so nothing is built for it.
    image: watchtower/producer:1.0
    container_name: watchtower-monitor
    command: ["python", "-m", "monitor"]
    # pid: host shows every process in the VM, for memory per service. A uid
    # of its own, so it cannot signal the producer's (10001) processes.
    pid: host
    user: "10002"
    working_dir: /app
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    environment:
      PYTHONPATH: /app:/app/etl
      PYTHONDONTWRITEBYTECODE: "1"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
      FLINK_REST_URL: http://flink-jobmanager:8081
      AIRFLOW_URL: http://airflow:8080
    secrets:
      - clickhouse_password
    volumes:
      - ./monitor:/app/monitor:ro
      - ./etl:/app/etl:ro
      - ./schemas:/app/schemas:ro
      - ./tools:/app/tools:ro
      - ./orchestration:/app/orchestration:ro
    ports:
      - "127.0.0.1:9400:9400"   # /metrics
    mem_limit: 256m
    restart: unless-stopped

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.14.0
    container_name: watchtower-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./deploy/observability/prometheus-compose.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./deploy/observability/audit-alerts.yml:/etc/prometheus/audit-alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 384m
    restart: unless-stopped

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:13.2.2
    container_name: watchtower-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Dashboards open without a login -- read-only, and on localhost only
      # (the port binding below). Editing still takes the admin password.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/watchtower-audit.json
      # Alert rules live in Prometheus (alerts.yml, audit-alerts.yml); no
      # plugin downloads, no phoning home.
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    secrets:
      - grafana_admin_password
    volumes:
      - ./deploy/observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./deploy/observability/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./deploy/observability/grafana-audit-dashboard.json:/var/lib/grafana/dashboards/watchtower-audit.json:ro
      - ./deploy/observability/grafana-dashboard.json:/var/lib/grafana/dashboards/watchtower.json:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 384m
    restart: unless-stopped

secrets:
  clickhouse_password:
    file: ./secrets/clickhouse_password
  groq_api_key:
    file: ./secrets/groq_api_key
  airflow_db_password:
    file: ./secrets/airflow_db_password
  airflow_jwt_secret:
    file: ./secrets/airflow_jwt_secret
  airflow_admin_password:
    file: ./secrets/airflow_admin_password
  grafana_admin_password:
    file: ./secrets/grafana_admin_password

volumes:
  kafka-data:
  clickhouse-data:
  flink-checkpoints:
  airflow-db:
  airflow-logs:
  prometheus-data:
  grafana-data:
